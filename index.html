<!DOCTYPE html>
<html lang="he" dir="rtl" class="loading">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>מספר 8 — תשיעיות</title>
<meta name="description" content="תרחישים טקטיים לכדורגל תשיעיות: מיקומים, תנועות וטעויות נפוצות.">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#E8E2D4">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="מספר 8">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32">
<link rel="stylesheet" href="fonts.css">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div class="wrap">

  <div class="state" id="state">טוען…</div>

  <div class="eyebrow" id="eyebrow"></div>

  <div class="head">
    <div class="mark" aria-hidden="true"><span class="b" id="mark-b"></span><span class="p" id="mark-p"></span></div>
    <div>
      <h1 id="b-title"></h1>
      <p class="lede" id="b-lede"></p>
    </div>
  </div>

  <div class="track" id="track" aria-hidden="true"></div>
  <div class="count" id="count"></div>

  <button id="install" type="button">התקן את האפליקציה על המסך</button>

  <div class="formation" id="formation">
    <b id="f-label"></b>
  </div>

  <div class="rail"><div class="chips" id="chips" role="tablist"></div></div>

  <div class="board" id="board">
    <svg id="pitch" viewBox="0 0 400 620" role="img" aria-label="דיאגרמת מגרש תשיעיות">
      <defs>
        <marker id="hp" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#E5326F"/></marker>
        <marker id="hb" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1F4FA8"/></marker>
        <marker id="hg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6E7A6B"/></marker>
      </defs>
      <rect x="20" y="20" width="360" height="580" fill="#D6DAC6"/>
      <g id="zones"></g>
      <g class="pl">
        <rect x="20" y="20" width="360" height="580"/>
        <line x1="20" y1="310" x2="380" y2="310"/>
        <circle cx="200" cy="310" r="52"/>
        <circle cx="200" cy="310" r="2.4" fill="#17211F" stroke="none" opacity=".4"/>
        <rect x="96" y="509" width="208" height="91"/>
        <rect x="150" y="562" width="100" height="38"/>
        <circle cx="200" cy="525" r="2.4" fill="#17211F" stroke="none" opacity=".4"/>
        <rect x="96" y="20" width="208" height="91"/>
        <rect x="150" y="20" width="100" height="38"/>
        <circle cx="200" cy="95" r="2.4" fill="#17211F" stroke="none" opacity=".4"/>
        <rect x="170" y="596" width="60" height="8"/>
        <rect x="170" y="16" width="60" height="8"/>
      </g>
      <g id="ghosts"></g>
      <g id="arrows"></g>
      <g id="opp"></g>
      <g id="team"></g>
      <g id="ball"></g>
    </svg>

    <div class="legend">
      <span><i class="sw" style="background:#1F4FA8"></i>הקבוצה שלנו</span>
      <span><i class="sw" style="background:#E5326F"></i><span id="lg-role"></span></span>
      <span><i class="sw" style="border:1.6px solid #6E7A6B"></i>יריב</span>
      <span><i class="sw" style="background:linear-gradient(90deg,#E5326F 60%,transparent 0)"></i>ריצה</span>
      <span><i class="sw" style="background:repeating-linear-gradient(90deg,#1F4FA8 0 5px,transparent 5px 9px)"></i>מסירה</span>
      <span><i class="sw" style="border:1.4px dashed #E5326F"></i>נקודת התחלה</span>
    </div>
  </div>
  <div class="hint">החלק ימינה ושמאלה כדי לעבור בין התרחישים</div>

  <div class="panel">
    <div class="phase" id="p-phase"></div>
    <h2 id="p-title"></h2>
    <p class="sub" id="p-sub"></p>
    <ul id="p-does"></ul>
    <div class="mistake"><b>טעות נפוצה</b><span id="p-mistake"></span></div>
    <div class="cue"><small>מה צועקים מהקו</small><span id="p-cue"></span></div>

    <button class="learn" id="learn" type="button" aria-pressed="false"><span id="learn-txt">סמן שלמדתי את זה</span></button>
    <div class="nav">
      <button id="prev" type="button">הקודם</button>
      <button id="next" type="button">התרחיש הבא</button>
    </div>
  </div>

  <div class="close">
    <h3 id="d-title"></h3>
    <div id="drills"></div>
    <p class="foot"><span id="d-foot"></span><br>
    <button class="reset" id="reset" type="button">אפס את הסימונים</button></p>
  </div>

</div>

<script type="module" src="js/app.js"></script>
</body>
</html>
