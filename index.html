<!DOCTYPE html>
<html lang="he" dir="rtl" class="loading">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>מספר 8 — תשיעיות</title>
<meta name="description" content="תרחישים טקטיים לכדורגל תשיעיות: מיקומים, תנועות, החלטות עם הכדור וטעויות נפוצות.">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#E8E2D4">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="מספר 8">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32">
<link rel="stylesheet" href="fonts.css">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div class="wrap">

  <div class="state" id="state">טוען…</div>

  <!-- ===== מסך הבית: החוברות ===== -->
  <section id="library" hidden>
    <div class="eyebrow" id="lib-eyebrow"></div>
    <h1 id="lib-title"></h1>
    <p class="lede" id="lib-lede"></p>

    <button id="install" type="button">התקן את האפליקציה על המסך</button>

    <div class="cards" id="cards"></div>

    <p class="foot"><span id="lib-foot"></span><span class="ver" id="lib-ver"></span></p>
  </section>

  <!-- ===== מסך חוברת ===== -->
  <section id="booklet" hidden>
    <a class="back" href="#/" id="back">כל החוברות ←</a>

    <div class="eyebrow" id="eyebrow"></div>

    <div class="head">
      <div class="mark" aria-hidden="true"><span class="b" id="mark-b"></span><span class="p" id="mark-p"></span></div>
      <div>
        <h1 id="b-title"></h1>
        <p class="lede" id="b-lede"></p>
      </div>
    </div>

    <div class="track" id="track" aria-hidden="true"></div>
    <div class="count" id="count"></div>

    <div class="formation" id="formation">
      <b id="f-label"></b>
    </div>

    <div class="side" id="side">
      <span id="side-label"></span>
      <button type="button" data-foot="R" aria-pressed="true">ימין</button>
      <button type="button" data-foot="L" aria-pressed="false">שמאל</button>
      <em id="side-hint"></em>
    </div>

    <div class="rail"><div class="chips" id="chips" role="tablist"></div></div>

    <div class="board" id="board">
      <div class="legend">
        <span><i class="sw" style="background:#1F4FA8"></i>הקבוצה שלנו</span>
        <span><i class="sw" style="background:#E5326F"></i><span id="lg-role"></span></span>
        <span><i class="sw" style="border:1.6px solid #6E7A6B"></i>יריב</span>
        <span><i class="sw" style="background:linear-gradient(90deg,#E5326F 60%,transparent 0)"></i>ריצה</span>
        <span><i class="sw" style="background:repeating-linear-gradient(90deg,#1F4FA8 0 5px,transparent 5px 9px)"></i>מסירה</span>
        <span><i class="sw" style="border:1.4px dashed #E5326F"></i>נקודת התחלה</span>
      </div>
    </div>
    <div class="hint" id="hint">החלק ימינה ושמאלה כדי לעבור בין התרחישים</div>

    <div class="panel">
      <div class="phase" id="p-phase"></div>
      <h2 id="p-title"></h2>
      <p class="sub" id="p-sub"></p>
      <ul id="p-does"></ul>
      <div class="mistake"><b>טעות נפוצה</b><span id="p-mistake"></span></div>
      <div class="cue"><small>מה צועקים מהקו</small><span id="p-cue"></span></div>

      <button class="learn" id="learn" type="button" aria-pressed="false"><span id="learn-txt">סמן שלמדתי את זה</span></button>
      <div class="nav">
        <button id="prev" type="button">הקודם</button>
        <button id="next" type="button">התרחיש הבא</button>
      </div>
    </div>

    <p class="foot" id="closing">
      <button class="reset" id="reset" type="button">אפס את הסימונים</button>
    </p>
  </section>

  <!-- ===== מסך מבדק ===== -->
  <section id="quiz" hidden>
    <a class="back" href="#/" id="q-back">כל החוברות ←</a>
    <div class="eyebrow" id="q-eyebrow"></div>

    <div class="track" id="q-track" aria-hidden="true"></div>
    <div class="count" id="q-count"></div>

    <div id="q-stage">
      <div class="phase" id="q-context"></div>
      <h2 id="q-ask"></h2>

      <div class="board" id="q-board"></div>
      <p class="hint" id="q-hint">גע במגרש במקום שבו אתה צריך להיות</p>

      <div class="qfeed" id="q-feed" hidden></div>
      <div class="qchoices" id="q-choices" hidden></div>

      <div class="nav"><button id="q-confirm" type="button">זהו, זה המקום</button></div>
    </div>

    <div id="q-result" hidden></div>
  </section>

</div>

<script type="module" src="js/app.js"></script>
</body>
</html>
